name: Release candidates

# Daily: what the labs dated in their changelogs or posted to their newsrooms
# that this repository has not reported before — once, in its own issue.
#
# The two channels it runs (sweep-changelogs, check-feeds) are the ones that
# found every release in the October 2026 updates. scan.yml had already seen
# Claude Haiku 5.5 and Cloudflare's Clef, but said so as backlog lines in the
# 100th comment on a single issue, repeated every twelve hours, where nobody
# read them. So this job reports only the delta, and a day with news gets a
# new issue — which notifies — rather than another comment on an old one.
#
# It reports; it never adds. Turning a candidate into a record still means the
# lab's own page, its date and a snapshot (CLAUDE.md, "update LLM World").

on:
  schedule:
    - cron: '7 7 * * *'     # 07:07 UTC, after scan.yml's morning run
  workflow_dispatch:
    inputs:
      days:
        description: How many days back to look
        default: '4'

permissions:
  contents: write
  issues: write

concurrency:
  group: candidates
  cancel-in-progress: false

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find what is new
        id: find
        run: |
          set -o pipefail
          node scripts/candidates.mjs --days=${{ inputs.days || '4' }} --record | tee candidates.md

      # The seen list is state, like data/seen-candidates.json for scan.yml:
      # it is what lets tomorrow's run say only what is new.
      - name: Remember what was reported
        if: steps.find.outputs.count != '0'
        run: |
          git config user.name "llm-world bot"
          git config user.email "noreply@github.com"
          git add data/seen-announcements.json
          if ! git diff --cached --quiet; then
            git commit -m "Record announcements reported by the daily candidates run

          Reported once, so tomorrow's run shows only what is new. Presence here
          means reported, never tracked."
            git pull --rebase --quiet
            git push
          fi

      - name: Open an issue for today
        if: steps.find.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COUNT: ${{ steps.find.outputs.count }}
        run: |
          gh label create candidates --repo "$REPO" \
            --description "Announced by a lab, not yet checked" --color FBCA04 2>/dev/null || true
          gh issue create --repo "$REPO" --label candidates \
            --title "$COUNT release candidate$([ "$COUNT" = 1 ] || echo s) — $(date -u +%Y-%m-%d)" \
            --body-file candidates.md
