name: Verify milestones

# Milestones live under a DIFFERENT evidence standard from model records, and
# that is why they need their own watch.
#
# A model record must cite the lab's own announcement. A milestone — an agent
# launch, a harness, a policy date — may be dated only by Import AI, The Batch,
# a newsletter or a Hacker News thread. That is allowed here: such a record is
# `partially_verified`, never `verified`, and says in its reason what is
# missing.
#
# Relaxing WHO may state a fact makes it more important to keep checking the
# fact was stated at all, because those are precisely the pages that go dead,
# get paywalled, or are quietly rewritten. This asks one question of every
# milestone — does the page it cites still state the date it claims — and
# archives the ones with no snapshot.
#
# It reports. It never edits a date and never publishes a draft: a draft is
# promoted by a person removing `draft: true`, after reading the evidence quote
# against the source.

on:
  schedule:
    - cron: '37 6 * * 2'   # Tuesdays, 06:37 UTC — clear of the other jobs
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: milestones
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Snapshot first, so the verification below can read the archived copy
      # rather than a live page that may already have changed. Media sources rot
      # fastest and these are mostly media.
      - name: Archive any milestone source with no snapshot
        continue-on-error: true
        run: node scripts/archive-sources.mjs --save --save-max=6 --write

      - name: Check every milestone against its sources
        id: verify
        run: |
          set -o pipefail
          node scripts/verify-milestones.mjs > report.md 2>&1 || true
          echo "--- report ---"
          cat report.md
          # Fail the JOB only on a date no source states. Unreadable is a
          # network answer, not an evidence one, and must not cry wolf weekly.
          if grep -q '^  ABSENT' report.md; then echo "bad=true" >> "$GITHUB_OUTPUT"; fi

      - name: Commit any snapshots that were found
        run: |
          git config user.name "llm-world bot"
          git config user.email "noreply@github.com"
          git add data/milestones.json data/llm-releases.json
          if ! git diff --cached --quiet; then
            git commit -m "Milestones: record snapshots that became available

          Milestone sources are mostly media and rot fastest, so they are
          archived on the same schedule as the dataset's own."
            git push
          fi

      - name: Open or update the issue when a date is unsupported
        if: steps.verify.outputs.bad == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = 'A milestone claims a date that none of its sources states.\n\n'
              + 'This is reported, never corrected automatically — the date may be right and the\n'
              + 'source may have been rewritten, or the date may be wrong. A person decides.\n\n'
              + '```\n' + fs.readFileSync('report.md', 'utf8').slice(0, 60000) + '\n```';
            const title = 'Milestone dates need checking';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'milestones',
            });
            if (open.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['milestones'],
              });
            }
