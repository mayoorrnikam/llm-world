name: Scan lab documentation

# Twice daily, because a model documented this morning should not wait a week.
#
# It watches each lab's MODEL DOCUMENTATION, which is the channel that works for
# labs the other two discovery scripts cannot see: check-freshness reads Hugging
# Face and is blind to anyone shipping no weights, check-feeds reads RSS and xAI
# publishes none. Grok 4.6 and Grok 4.20 were both live and documented while
# this dataset's newest xAI record was Grok 4.5, and neither script could have
# noticed.
#
# It reports; it never adds. A docs listing is a discovery source (METHODOLOGY
# §5) — the record that follows still has to cite the lab's own announcement
# and carry an archived snapshot.

on:
  schedule:
    - cron: '17 6 * * *'    # 06:17 UTC
    - cron: '17 18 * * *'   # 18:17 UTC
  workflow_dispatch:
    inputs:
      backlog:
        description: List everything untracked, not just what is new
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scan
        id: scan
        run: |
          set -o pipefail
          FLAGS="--record"
          if [ "${{ inputs.backlog }}" = "true" ]; then FLAGS="--backlog"; fi
          node scripts/scan-labs.mjs $FLAGS > scan.md
          # A fourth channel, and the only one that compares a value we already
          # hold against a value in the world. `|| true` on purpose: a catalogue
          # that will not answer must delay this work, never cancel it — the same
          # rule archive.yml follows when archive.org is down.
          echo "" >> scan.md
          echo "# Served by a provider" >> scan.md
          node scripts/check-providers.mjs $FLAGS >> scan.md 2>&1 || true
          # For open-weights models the catalogue also names the Hugging Face
          # repo, and a model card is a primary source. Drafting stops at the
          # spec: the record still needs the announcement and a person.
          echo "" >> scan.md
          node scripts/hf-bridge.mjs --limit=15 >> scan.md 2>&1 || true
          # The only channel not bounded by labs we already know. Every other
          # one reads documentation, a catalogue or an org list derived from the
          # dataset, so a lab that has just appeared is invisible to all of
          # them. This asks Hugging Face what anyone published and subtracts the
          # watch list, which is the opposite operation.
          echo "" >> scan.md
          node scripts/hf-new-orgs.mjs >> scan.md 2>&1 || true
          # A release added on announcement day cannot have an archive snapshot
          # or, often, its weights yet. This comes back for both rather than
          # letting "not yet" quietly become "never".
          echo "" >> scan.md
          echo "## Follow-up" >> scan.md
          echo '```' >> scan.md
          node scripts/follow-up.mjs >> scan.md 2>&1 || true
          echo '```' >> scan.md
          cat scan.md
          # Any channel having something to act on opens the issue. Keying only
          # on the docs scan would have hidden a served-but-untracked model, and
          # a value disagreeing with what is served, behind a quiet docs day.
          if grep -qE 'newly listed by a lab|not tracked — [1-9]|is served — [1-9]|with a model card' scan.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # The seen list is state, not generated output: it records what has been
      # reported so the next scan can report only the delta. Committing it is
      # what stops a twice-daily job repeating the same backlog 730 times.
      - name: Record what was surfaced
        if: steps.scan.outputs.found == 'true' && inputs.backlog != true
        run: |
          git config user.name "llm-world bot"
          git config user.email "noreply@github.com"
          git add data/seen-candidates.json data/seen-providers.json
          if ! git diff --cached --quiet; then
            git commit -m "Record identifiers surfaced by the scan

          Reported once, so the next scan shows only what is new. Presence here
          means surfaced, never tracked — the dataset is the record of what is
          tracked."
            git push
          fi

      - name: Open or update the tracking issue
        if: steps.scan.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="Documented by a lab, missing here"
          BODY="$(cat scan.md)"
          EXISTING=$(gh issue list --repo "$REPO" --state open \
                       --label discovery --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
            echo "commented on #$EXISTING"
          else
            gh label create discovery --repo "$REPO" \
              --description "A lab documents a model this dataset lacks" --color 1D76DB 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$TITLE" --label discovery --body "$BODY"
          fi

  # ------------------------------------------------------------------ drafts
  #
  # The scan opens an ISSUE for everything it finds, because a name is not
  # evidence. This job is the narrow exception: for an open-weights model with a
  # Hugging Face card, the card IS a primary source — the lab publishes it,
  # declares its own licence on it, and it has dated revisions. So the labour
  # between "noticed" and "reviewable" is mechanical, and mechanical labour is
  # the only thing that should be automated here.
  #
  # WHAT THE BOT CANNOT DO, AND SAYS SO IN THE PR
  #
  # The drafted date is when the REPO appeared, not when the lab announced.
  # hf-bridge is explicit about it and so is the pull request body: a reviewer
  # replaces the date with the announcement, sets the family, and confirms the
  # lab name. A record merged with a repo-creation date would be this project
  # publishing a date no source states, which is the one thing it exists not to
  # do.
  #
  # Once a day, not twice, and three at a time. A review queue that outgrows the
  # reviewer stops being read, and an unread queue of bot PRs is worse than no
  # PRs — the backlog issue already taught this repo that lesson once.
  draft:
    needs: scan
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Work ON the open PR's branch, not beside it.
      #
      # This used to skip entirely while a drafts PR was open, reasoning that a
      # queue of bot pull requests nobody reads is worse than none. That was the
      # wrong shape: PR #4 sat unmerged for two days and every morning run
      # drafted models and then threw them away, because one unmerged PR
      # silently blocked all drafting for as long as it stayed open.
      #
      # Choosing the branch BEFORE drafting also fixes a second thing. hf-bridge
      # skips models already in the dataset, so running on the branch means
      # yesterday's drafts count as tracked and today's run proposes only what
      # is genuinely new, instead of re-drafting the same records.
      - name: Pick the branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Drafts from the model-card scan"
          EXISTING=$(gh pr list --state open --search "$TITLE in:title" --json headRefName -q '.[0].headRefName')
          if [ -n "$EXISTING" ]; then
            git fetch origin "$EXISTING"
            git checkout "$EXISTING"
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -b "scan/drafts-$(date -u +%Y%m%d)"
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"

      - name: Draft what has a model card
        id: spec
        run: |
          set -o pipefail
          node scripts/hf-bridge.mjs --limit=3 --known-labs --spec=draft-spec.json 2>&1 | tee bridge.md
          ls -1 draft-spec*.json 2>/dev/null | tee spec-files.txt || true
          test -s spec-files.txt && echo "found=true" >> "$GITHUB_OUTPUT" || echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Add and validate
        id: apply
        if: steps.spec.outputs.found == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          while read -r f; do node scripts/add-model.mjs "$f" --write 2>&1 | tee -a bridge.md; done < spec-files.txt
          # --write, and the flag is the whole point. `check` runs update-readme
          # as a CHECKER and exits 1 on drift — and adding records is exactly
          # what causes the drift. Without this the job drafted three models
          # every morning, failed on the README, and threw the work away,
          # because the pull-request step is gated on this step succeeding.
          # archive.yml has always regenerated first; this did not.
          node scripts/update-readme.mjs --write 2>&1 | tail -5 | tee -a bridge.md
          npm run check 2>&1 | tail -30 | tee -a bridge.md

      - name: Push, and open the pull request if there is not one
        if: steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          git config user.name "llm-world bot"
          git config user.email "noreply@github.com"
          rm -f draft-spec*.json spec-files.txt bridge.md scan.md
          git add data/ README.md
          if git diff --cached --quiet; then
            echo "nothing new to draft" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git commit -m "Draft open-weights records found by the model-card scan

          Drafted from Hugging Face model cards, which are primary sources: the
          lab publishes the card and declares its licence on it. Every figure is
          quoted from a card or absent — nothing is estimated.

          The DATE IS PROVISIONAL. It is when the repository appeared, not when
          the lab announced, and no source states it as a release date. It must
          be replaced before this is merged: a draft for Qwen3.8-Flash-Next once
          carried a repo date three weeks later than the announcement."
          # Force ONLY on a branch nobody is reviewing.
          #
          # A date-named branch outlives the pull request it was opened for:
          # scan/drafts-20260904 survived its PR being closed, so a later run the
          # same day built a fresh branch of that name, diverged, and was
          # rejected. Force is correct there — the old branch is abandoned.
          #
          # It is never correct on the branch of an OPEN pull request, which is
          # the one a reviewer may have pushed a corrected date to. That work is
          # the entire point of the review, and force-pushing would erase it.
          if [ "${{ steps.branch.outputs.open }}" = "true" ]; then
            git push origin "$BRANCH"
            echo "added to the open drafts PR on $BRANCH" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push -u origin "$BRANCH" --force
          gh pr create --title "Drafts from the model-card scan" --label discovery \
            --body "Drafted by the twice-daily scan from Hugging Face model cards.

          **A reviewer must do these before merging — the bot cannot:**
          - [ ] Replace the release date. The drafted one is when the *repo* appeared. Find the lab's own announcement and use the date it states. One draft was three weeks out this way.
          - [ ] Set **family**, and confirm the lab name is the one this dataset uses.
          - [ ] Confirm each card is this model's own card, not a sibling's. A draft named Qwen3.8 Flash was built from the card for Qwen3.8-Flash-Next.
          - [ ] Check the id matches this dataset's convention — hyphens, no dots.
          - [ ] Check any parameter count is a real count and not a quantised checkpoint's packed byte total.

          A card is a primary source for the licence, the weights and the specs. It is **not** a source for the release date, so these records cannot be **verified** until the announcement is cited.

          Later runs add to this branch rather than opening a second pull request." >> "$GITHUB_STEP_SUMMARY"
